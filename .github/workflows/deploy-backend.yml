name: Deploy Backend
# NOTE: Reference workflow only. Configure AZURE_WEBAPP_NAME and
# AZURE_WEBAPP_PUBLISH_PROFILE secrets in your own GitHub repository settings.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/ClickBurger/**'

defaults:
  run:
    working-directory: src/ClickBurger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore ClickBurger.sln
      - run: dotnet build ClickBurger.sln --configuration Release --no-restore
      - run: dotnet test ClickBurger.sln --configuration Release --no-build --verbosity normal
      - run: dotnet publish ClickBurger/ClickBurger.csproj -c Release -o ./publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: src/ClickBurger/publish
